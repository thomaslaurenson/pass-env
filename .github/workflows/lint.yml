name: Lint

on: workflow_call

permissions:
  contents: read

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y shellcheck zsh

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck bash

      - name: Print bash version
        run: bash --version

      - name: Run linter
        run: make lint

      - name: Check version consistency
        run: make check_version
