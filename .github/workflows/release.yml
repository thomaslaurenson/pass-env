name: Release

on: workflow_call

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify version matches tag
        run: make check_version_tag TAG="${TAG}"

      - name: Build release artefacts
        run: make dist TAG="${TAG}"

      - name: Extract release notes
        run: make get_changelog TAG="${TAG}" > /tmp/release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" \
            --notes-file /tmp/release-notes.md \
            "dist/pass-env-${TAG}.tar.gz" dist/install.sh dist/checksums.txt
