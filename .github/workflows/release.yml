name: Release

on: workflow_call

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Verify version matches tag
        run: make check_version_tag TAG=${{ github.ref_name }}

      - name: Build tarball
        run: git archive --prefix="pass-env-${{ github.ref_name }}/" HEAD | gzip > "pass-env-${{ github.ref_name }}.tar.gz"

      - name: Bake version into install.sh
        run: |
          cp scripts/install.sh install.sh
          sed -i 's/^VERSION=.*/VERSION="${{ github.ref_name }}"/' install.sh

      - name: Extract release notes
        run: make get_changelog_entry TAG=${{ github.ref_name }} > /tmp/release-notes.md

      - name: Generate checksums
        run: sha256sum "pass-env-${{ github.ref_name }}.tar.gz" install.sh > checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md \
            "pass-env-${{ github.ref_name }}.tar.gz" install.sh checksums.txt

