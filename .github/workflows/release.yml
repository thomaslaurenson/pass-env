name: Release

on: workflow_call

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify version matches tag
        run: make check_version_tag TAG="${TAG}"

      - name: Build tarball
        run: git archive --prefix="pass-env-${TAG}/" HEAD | gzip > "pass-env-${TAG}.tar.gz"

      - name: Bake version into install.sh
        run: |
          cp scripts/install.sh install.sh
          sed -i "s/^VERSION=.*/VERSION=\"${TAG}\"/" install.sh

      - name: Extract release notes
        run: make get_changelog TAG="${TAG}" > /tmp/release-notes.md

      - name: Generate checksums
        run: sha256sum "pass-env-${TAG}.tar.gz" install.sh > checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" \
            --notes-file /tmp/release-notes.md \
            "pass-env-${TAG}.tar.gz" install.sh checksums.txt

