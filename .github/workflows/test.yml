name: Test

on: workflow_call

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install bash (macOS, system bash 3.2 is too old for bats)
        if: runner.os == 'macOS'
        run: brew install bash zsh

      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y zsh

      - name: Print bash version
        run: bash --version

      - name: Run tests
        run: make test
