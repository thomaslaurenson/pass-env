name: Test

on: workflow_call

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install bash (macOS — system bash 3.2 is too old for bats)
        if: runner.os == 'macOS'
        run: brew install bash zsh

      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y zsh

      - name: Print bash version
        run: bash --version

      - name: Run tests
        run: make test

      - name: Run zsh integration test
        run: zsh test/zsh_integration.zsh
